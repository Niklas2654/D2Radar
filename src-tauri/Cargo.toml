[package]
name = "radar"
version = "1.3.0"
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads bungie.local.json (build.rs).
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
# Updates from the public D2Radar repo's releases (Settings → About), and the restart after.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
futures = "0.3"
# Weapon detection: screen capture + Windows OCR + fuzzy name matching.
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
strsim = "0.11"
# The WebView2 types Tauri hands out (DIM snapshots); same version as wry's.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tract-onnx = "0.21"

[dev-dependencies]
# Reads test screenshots (webp) in the watermark matching test.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# The dev build does image work (screen reading, icon matching) many times a
# second: optimized, it keeps up like the release build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
